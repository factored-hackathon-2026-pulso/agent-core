services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentcore
      POSTGRES_PASSWORD: agentcore-dev-only   # credencial de desarrollo local, no es secreta
      POSTGRES_DB: agentcore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcore"]
      interval: 5s
      timeout: 3s
      retries: 10
