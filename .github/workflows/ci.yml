name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentcore
          POSTGRES_PASSWORD: agentcore-dev-only
          POSTGRES_DB: agentcore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentcore" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AGENTCORE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (verificado con git ls-remote)
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2 (verificado con git ls-remote)
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run agentcore contracts --check
      - run: uv run agentcore validate tests/m01/fixtures/registry
      - run: uv run agentcore validate tests/fixtures/registry-demo
      - name: replay fixture de los seis caminos (T-M11-01)
        run: |
          for f in tests/fixtures/runs/*.yaml; do
            uv run agentcore replay "$f" --mode fixture \
              --registry tests/fixtures/registry-demo \
              --catalog tests/fixtures/catalogo-datos-prueba.yaml || exit 1
          done
      - run: uv run pytest
