# Añadidos SOLO para la prueba local (no son parte del contrato de despliegue):
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.local.yml --env-file deploy/compose/.env up --build
# - Postgres publicado en 127.0.0.1:${PG_PORT:-55435} para importar el registry desde el host.
# - grants-stub: DOBLE de la plataforma (toda delegación firmada vale); `serve` apunta a él.
services:
  postgres:
    ports:
      - "127.0.0.1:${PG_PORT:-55435}:5432"
  grants-stub:
    image: python:3.12-slim
    command: ["python", "/stub/grants_stub.py"]
    environment:
      GRANTS_TOKEN: ${AGENTCORE_GRANTS_TOKEN}
    volumes:
      - ./local:/stub:ro
  serve:
    environment:
      AGENTCORE_GRANTS_URL: http://grants-stub:8099
    depends_on:
      grants-stub: {condition: service_started}
