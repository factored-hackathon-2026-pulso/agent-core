locales:
  es: "Redacta un mensaje breve y cordial, en una o dos frases, para el cliente que confirme que su disputa fue radicada y que recibirá novedades. Trátalo siempre de tú (tu disputa, te avisaremos), igual que el resto de la conversación: nunca de usted. No incluyas ningún número, cifra, fecha ni identificador."
  pt: "Redija uma mensagem breve e cordial, em uma ou duas frases, para o cliente confirmando que sua contestação foi registrada e que receberá novidades. Trate-o sempre por você, como no resto da conversa. Não inclua nenhum número, valor, data ou identificador."
