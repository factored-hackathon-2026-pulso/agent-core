id: constructor-chat
version: 1.0.0
mode: conversational
entry_flow: construir@1
invocable_by: [builder]
min_auth_level: session
subject_kinds: []
supported_locales: [es]
default_locale: es
understand: understand-constructor@1
tools_allowed: [registry/get_entity@1, registry/list_versions@1, registry/get_proposal@1, registry/get_write@1, registry/create_proposal@1, registry/put_draft@1, registry/validate@1]
budgets: {max_nodes_per_turn: 40, max_model_calls_per_turn: 8, max_tokens_per_run: 60000, max_cost_per_run: 1.00, max_wall_ms_per_turn: 60000}
inactivity_ttl: PT2H
templates:
  clarify: t/aclarar
  abstain: t/abstencion
  handoff: t/traspaso
  pending_ack: t/acuse
  pending_offer: t/oferta
  unsupported_language: t/idioma_no_soportado
  input_too_large: t/mensaje_largo
max_clarifications: 2
on_clarify_exhausted: end
default_target_queue: general
