id: asistir
version: 1.0.0
priority: 50
nodes:
  - {id: pedir, type: collect, config: {slot: pedido, prompt_ref: t/pedir_pedido, max_attempts: 3},
     next: {ok: investigar, max_attempts: fin_sin_pedido}}
  - id: investigar
    type: agent
    config:
      tools_allowed: [leer_movimientos@1, leer_productos@1, leer_pqr_cliente@1, obtener_handoff@1, leer_transcript@1]
      max_steps: 6
      prompt_ref: p/copiloto@1
      goal: "Responder al asesor el pedido sobre el cliente que atiende, usando solo lo que leas con las tools."
      save_as: hallazgo
      input_view: [slots.pedido]
      # Las cifras y fechas van en `datos` como valores sueltos (M8 §3.3 solo respalda una cifra con un valor
      # numérico o una fecha ISO del hecho citado, nunca con texto libre) y su clase se declara en el
      # FieldClassifier (testing/e2e_demo.py): sin clasificar, M7 tokeniza todo campo de la salida del agente.
      output_schema:
        type: object
        additionalProperties: false
        required: [resumen, datos]
        properties:
          resumen: {type: string}
          datos:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [concepto, fuente]
              properties:
                concepto: {type: string}
                valor: {type: number}
                moneda: {type: string, enum: [USD, COP, MXN, ARS]}
                fecha: {type: string}
                detalle: {type: string}
                fuente: {type: string, enum: [productos, movimientos, pqr, traspaso, conversacion]}
    next: {answered: responder, gave_up: no_pude}
  - {id: responder, type: respond,
     config: {generate: {prompt_ref: p/respuesta_asesor@1, allowed_facts: [facts.hallazgo], purpose: advisor_view, fallback_template_ref: t/copiloto_fallback@1}},
     next: {next: pedir}}
  - {id: no_pude, type: respond, config: {template_ref: t/copiloto_sin_respuesta}, next: {next: pedir}}
  - {id: fin_sin_pedido, type: end, config: {outcome: abstained}}
