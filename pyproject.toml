[project]
name = "agent-core"
version = "0.1.0"
description = "Núcleo de agentes: motor de decisión que ejecuta agentes descritos como datos versionados."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "lingua-language-detector==2.1.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "boto3>=1.35",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "rfc8785>=0.1.4",
    "uvicorn>=0.30",
]

[project.scripts]
agentcore = "agent_core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "ruff>=0.7",
    "import-linter>=2.1",
    "types-pyyaml>=6.0.12",
    "respx>=0.23.1",
    "moto[s3,sns]>=5.0",
    "boto3-stubs[s3,sns]>=1.35",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core", "agent_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "perf: mide latencia; solo corre con AGENT_CORE_PERF=1",
    "integration: requiere Postgres (docker compose up -d postgres)",
]
filterwarnings = ["error::UserWarning:pydantic.*"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["agent_core", "agent_telemetry", "testing"]

[[tool.mypy.overrides]]
module = ["rfc8785"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID", "DTZ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español y delimitadores ⟦⟧

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Usa el Clock inyectado (M0 §2.9)."
"datetime.datetime.utcnow".msg = "Usa el Clock inyectado (M0 §2.9)."
"datetime.date.today".msg = "Usa el Clock inyectado (M0 §2.9)."
"time.time".msg = "Usa el Clock inyectado (M0 §2.9)."
"time.time_ns".msg = "Usa el Clock inyectado (M0 §2.9)."
"time.monotonic".msg = "Usa Clock.monotonic_ns() (M0 §2.9)."
"time.monotonic_ns".msg = "Usa Clock.monotonic_ns() (M0 §2.9)."
"time.perf_counter".msg = "Usa Clock.monotonic_ns() (M0 §2.9)."
"time.process_time".msg = "Usa Clock.monotonic_ns() (M0 §2.9)."
"time.process_time_ns".msg = "Usa Clock.monotonic_ns() (M0 §2.9)."
"time.thread_time".msg = "Usa Clock.monotonic_ns() (M0 §2.9)."
"time.thread_time_ns".msg = "Usa Clock.monotonic_ns() (M0 §2.9)."
"time.perf_counter_ns".msg = "Usa Clock.monotonic_ns() (M0 §2.9)."
"time.clock_gettime".msg = "Usa Clock.monotonic_ns() (M0 §2.9)."
"time.clock_gettime_ns".msg = "Usa Clock.monotonic_ns() (M0 §2.9)."
"time.localtime".msg = "Usa el Clock inyectado (M0 §2.9)."
"time.gmtime".msg = "Usa el Clock inyectado (M0 §2.9)."
"time.ctime".msg = "Usa el Clock inyectado (M0 §2.9)."
"time.asctime".msg = "Usa el Clock inyectado (M0 §2.9)."
"datetime.datetime.today".msg = "Usa el Clock inyectado (M0 §2.9)."
"os.urandom".msg = "Usa IdSource.secret_token() (M0 §2.9)."
"os.getrandom".msg = "Usa IdSource.secret_token() (M0 §2.9)."
"uuid.uuid1".msg = "Usa el IdSource inyectado (M0 §2.9)."
"uuid.uuid4".msg = "Usa el IdSource inyectado (M0 §2.9)."
"random".msg = "Usa el IdSource inyectado (M0 §2.9)."
"secrets".msg = "Usa IdSource.secret_token() (M0 §2.9)."

[tool.ruff.lint.per-file-ignores]
"testing/calibration/understand_turno_phrases.py" = ["E501"]  # datos: una frase por elemento
"agent_core/adapters/system_clock.py" = ["TID251"]
"agent_core/adapters/system_ids.py" = ["TID251"]
